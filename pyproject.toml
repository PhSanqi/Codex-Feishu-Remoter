[project]
name = "cfr"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
cfr = "cfr.cli.main:cli"

[project.optional-dependencies]
feishu = [
    "lark-channel-sdk>=1,<2",
    "lark-oapi>=1.5.5,<2",
    "keyring>=25,<26",
    # lark-channel-sdk uses websockets 15 for its persistent Channel
    # connection.  When the host desktop/global proxy is SOCKS, websockets
    # requires python-socks while requests needs PySocks for the endpoint
    # handshake.  Keep both in the Feishu extra so a rebuilt CFR venv behaves
    # the same way as the configured Linux desktop network without changing
    # any host proxy settings.
    "python-socks>=2,<3",
    "PySocks>=1.7,<2",
]
desktop = [
    "pywebview>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
