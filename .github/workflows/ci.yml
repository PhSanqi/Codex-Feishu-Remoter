name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python package
        run: python -m pip install -e ".[feishu]"

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test*.py"

      - name: Public release boundary
        run: python scripts/check_public_release.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: m3_control/package-lock.json

      - name: Build Control Center
        working-directory: m3_control
        run: |
          npm ci
          npm run build
