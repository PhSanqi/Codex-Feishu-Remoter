<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.dataset.theme = 'light'
      try {
        if (localStorage.getItem('cfr-control-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
    <link rel="icon" href="/cfr_icon_light.ico" />
    <title>CFR 控制中心</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
